<!doctype html>
<html><head><meta charset="utf-8"><title>scene</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;transform-origin:540px 960px}
.fill{position:absolute;left:0;top:0;width:100%;height:100%}
img.fill{object-fit:cover}
/* example card from scene.js */
.card{position:absolute;left:140px;width:800px;height:300px;border-radius:44px;padding:40px 48px;
  backdrop-filter:blur(28px) saturate(1.2) brightness(.6);-webkit-backdrop-filter:blur(28px) saturate(1.2) brightness(.6);
  background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 40%,rgba(10,10,12,.25));
  border:1.5px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.card b{display:block;font:500 24px ui-monospace,Menlo,monospace;letter-spacing:.4em;opacity:.8}
.card .num{display:block;font-size:130px;font-weight:800;letter-spacing:-4px;line-height:1.1}
</style></head>
<body>
<div id="stage"></div>
<script src="footage/clip.js"></script>
<script src="engine.js"></script>
<script src="scene.js"></script>
</body></html>
